<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业知识库 AI Agent 平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --accent2: #818cf8;
    --user-bg: #2563eb; --ok: #34d399; --warn: #fbbf24;
  }
  html, body { height: 100%; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }

  /* ---------- 登录视图 ---------- */
  #login-view { display: flex; align-items: center; justify-content: center; height: 100vh;
    background: radial-gradient(1200px 600px at 20% 0%, #1e293b 0%, var(--bg) 60%); }
  .login-card { width: 380px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button { flex: 1; padding: 9px; border: 1px solid var(--line); background: transparent;
    color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: var(--panel2); color: var(--text); border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 12px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .btn-main { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #081018;
    font-size: 15px; font-weight: 600; }
  .btn-main:disabled { opacity: .5; cursor: wait; }
  #login-msg { color: #f87171; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }

  /* ---------- 主视图 ---------- */
  #app-view { display: none; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .logo { font-weight: 700; font-size: 16px; }
  header .logo span { color: var(--accent); }
  header .user { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  header .user button { background: transparent; border: 1px solid var(--line); color: var(--muted);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  header .user button:hover { color: var(--text); border-color: var(--accent); }

  .layout { display: flex; flex: 1; overflow: hidden; }
  aside { width: 300px; background: var(--panel); border-right: 1px solid var(--line);
    padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  aside h3 { font-size: 13px; color: var(--muted); font-weight: 600; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px 12px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; transition: .2s; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,.05); }
  .doc-list { flex: 1; overflow-y: auto; font-size: 13px; }
  .doc-item { padding: 8px 10px; background: var(--panel2); border-radius: 8px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; }
  .doc-item .ok { color: var(--ok); font-size: 12px; }
  .conv-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
  .conv-item { padding: 7px 10px; background: var(--panel2); border: 1px solid transparent; border-radius: 8px;
    margin-bottom: 6px; cursor: pointer; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .conv-item:hover, .conv-item.active { color: var(--text); border-color: var(--accent); }
  .tip { font-size: 12px; color: var(--muted); line-height: 1.7; border-top: 1px solid var(--line); padding-top: 12px; }

  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; font-size: 14px;
    line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bg); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
    border-bottom-left-radius: 4px; }
  .msg.ai .src { display: block; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line);
    color: var(--muted); font-size: 12px; }
  .steps { align-self: flex-start; display: flex; flex-direction: column; gap: 6px; max-width: 78%; }
  .step { font-size: 12px; color: var(--warn); background: rgba(251,191,36,.08);
    border: 1px solid rgba(251,191,36,.25); padding: 6px 12px; border-radius: 8px; }
  .step b { color: var(--warn); }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent);
    vertical-align: -2px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  footer { display: flex; gap: 10px; padding: 14px 20px; background: var(--panel);
    border-top: 1px solid var(--line); }
  footer textarea { flex: 1; resize: none; padding: 12px 14px; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 10px; font-size: 14px;
    font-family: inherit; outline: none; height: 48px; }
  footer textarea:focus { border-color: var(--accent); }
  footer button { padding: 0 26px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #081018;
    font-size: 15px; font-weight: 600; }
  footer button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="login-view">
  <div class="login-card">
    <h1>企业知识库 <span style="color:var(--accent)">AI Agent</span> 平台</h1>
    <div class="sub">RAG 检索增强 · Function Calling 工具调用 · SSE 流式响应</div>
    <div class="tabs">
      <button id="tab-login" class="active" onclick="switchTab('login')">登录</button>
      <button id="tab-reg" onclick="switchTab('reg')">注册</button>
    </div>
    <div class="field"><label>用户名</label><input id="f-user" placeholder="2-32 个字符"></div>
    <div class="field"><label>密码</label><input id="f-pass" type="password" placeholder="至少 6 位"></div>
    <button class="btn-main" id="btn-go" onclick="doAuth()">登 录</button>
    <div id="login-msg"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app-view">
  <header>
    <div class="logo">企业知识库 <span>AI Agent</span> 平台</div>
    <div class="user"><span id="whoami"></span><button onclick="newConversation()">＋ 新建对话</button><button onclick="logout()">退出登录</button></div>
  </header>
  <div class="layout">
    <aside>
      <h3>知识库文档</h3>
      <div class="drop" id="drop" onclick="document.getElementById('file-input').click()">
        点击选择 或 拖拽文件到这里<br><span style="font-size:11px">支持 PDF / Markdown / txt</span>
      </div>
      <input type="file" id="file-input" hidden accept=".pdf,.md,.txt">
      <div class="doc-list" id="doc-list"></div>
      <h3 style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px;">历史会话</h3>
      <div class="conv-list" id="conv-list"></div>
      <div class="tip">💡 试试问：<br>· 员工年假有多少天？<br>· 一线城市住宿报销标准？<br>· 张三是什么部门的？<br>· 现在几点了？</div>
    </aside>
    <main>
      <div id="chat"></div>
      <footer>
        <textarea id="input" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
        <button id="btn-send" onclick="send()">发送</button>
      </footer>
    </main>
  </div>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('token') || '';
let USERNAME = localStorage.getItem('username') || '';
let CONV_ID = null;
let tab = 'login';

// ---------- 认证 ----------
function switchTab(t) {
  tab = t;
  document.getElementById('tab-login').classList.toggle('active', t === 'login');
  document.getElementById('tab-reg').classList.toggle('active', t === 'reg');
  document.getElementById('btn-go').textContent = t === 'login' ? '登 录' : '注 册 并 登 录';
}
async function doAuth() {
  const username = document.getElementById('f-user').value.trim();
  const password = document.getElementById('f-pass').value;
  const msg = document.getElementById('login-msg');
  if (!username || !password) { msg.textContent = '请输入用户名和密码'; return; }
  const btn = document.getElementById('btn-go');
  btn.disabled = true; msg.textContent = '';
  try {
    let resp;
    if (tab === 'reg') {
      resp = await fetch(API + '/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (resp.status === 400) { msg.textContent = '用户名已被占用，请直接登录或换一个名字'; return; }
    } else {
      const form = new FormData();
      form.append('username', username); form.append('password', password);
      resp = await fetch(API + '/auth/login', { method: 'POST', body: form });
      if (resp.status === 401) { msg.textContent = '用户名或密码错误'; return; }
    }
    if (!resp.ok) { msg.textContent = '请求失败 (' + resp.status + ')'; return; }
    const data = await resp.json();
    TOKEN = data.access_token; USERNAME = data.username;
    localStorage.setItem('token', TOKEN); localStorage.setItem('username', USERNAME);
    enterApp();
  } catch (e) {
    msg.textContent = '无法连接后端服务，请确认 uvicorn 已启动';
  } finally { btn.disabled = false; }
}
function logout() {
  localStorage.clear(); TOKEN = ''; CONV_ID = null;
  document.getElementById('app-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'flex';
}
function enterApp() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'flex';
  document.getElementById('whoami').textContent = '👤 ' + USERNAME;
  addMsg('ai', '你好，' + USERNAME + '！我是企业知识库助手。请先在左侧上传文档建立知识库，然后就可以向我提问了。\n我能调用 6 个工具：知识库检索、SQL 查询、人员查询、政策查询、邮件发送、时间查询。');
  loadConversations();
}

// ---------- 聊天 ----------
function addMsg(role, text, src) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (src) {
    const s = document.createElement('span');
    s.className = 'src'; s.textContent = '📎 来源：' + src;
    div.appendChild(s);
  }
  document.getElementById('chat').appendChild(div);
  scrollBottom();
  return div;
}
function addStep(text) {
  const div = document.createElement('div');
  div.className = 'step'; div.innerHTML = text;
  document.getElementById('chat').appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

async function send() {
  const input = document.getElementById('input');
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  addMsg('user', question);

  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  const aiDiv = addMsg('ai', '');
  const cursor = document.createElement('span'); cursor.className = 'cursor';
  aiDiv.appendChild(cursor);
  let answer = '';

  try {
    const resp = await fetch(API + '/chat/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      body: JSON.stringify({ question, conversation_id: CONV_ID })
    });
    if (resp.status === 401) { logout(); return; }
    if (!resp.ok) { aiDiv.textContent = '请求失败 (' + resp.status + ')'; return; }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();                    // 最后一段可能不完整，留到下一轮
      for (const frame of frames) {
        const line = frame.trim();
        if (!line.startsWith('data:')) continue;
        const evt = JSON.parse(line.slice(5));

        if (evt.type === 'start') { CONV_ID = evt.conversation_id; }
        else if (evt.type === 'tool') {
          addStep('🔧 调用工具 <b>' + evt.tool_name + '</b> ' + (evt.args || '') +
            (evt.result ? '<br>→ ' + evt.result : ''));
          scrollBottom();
        }
        else if (evt.type === 'token') {
          answer += evt.content;
          aiDiv.textContent = answer;
          aiDiv.appendChild(cursor);
          scrollBottom();
        }
        else if (evt.type === 'done') {
          cursor.remove();
          loadConversations();
          if (evt.sources && evt.sources.length) {
            const s = document.createElement('span');
            s.className = 'src'; s.textContent = '📎 来源：' + evt.sources.join('、');
            aiDiv.appendChild(s);
          }
        }
      }
    }
  } catch (e) {
    aiDiv.textContent = answer || '连接中断：' + e.message;
  } finally {
    cursor.remove(); btn.disabled = false; input.focus();
  }
}

// ---------- 文档上传 ----------
async function uploadFile(file) {
  const list = document.getElementById('doc-list');
  const item = document.createElement('div');
  item.className = 'doc-item';
  item.innerHTML = '<span>' + file.name + '</span><span class="ok">上传中…</span>';
  list.prepend(item);
  const form = new FormData();
  form.append('file', file);
  try {
    const resp = await fetch(API + '/documents/upload', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: form
    });
    const data = await resp.json();
    if (resp.ok) {
      item.querySelector('.ok').textContent = '✓ ' + data.chunk_count + ' 块';
      addMsg('ai', '文档《' + data.filename + '》入库完成：共 ' + data.total_chars +
        ' 字，切分 ' + data.chunk_count + ' 块，向量化入库 ' + data.inserted + ' 条。现在可以就文档内容提问了。');
    } else {
      item.querySelector('.ok').textContent = '失败';
      item.querySelector('.ok').style.color = '#f87171';
      addMsg('ai', '上传失败：' + (data.detail || resp.status));
    }
  } catch (e) { item.querySelector('.ok').textContent = '失败'; }
}

// ---------- 会话管理 ----------
function newConversation() {
  CONV_ID = null;
  document.getElementById('chat').innerHTML = '';
  addMsg('ai', '已开始新对话，请提问。');
  loadConversations();
}

async function loadConversations() {
  try {
    const resp = await fetch(API + '/chat/conversations', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!resp.ok) return;
    const list = await resp.json();
    const box = document.getElementById('conv-list');
    box.innerHTML = '';
    list.forEach(c => {
      const div = document.createElement('div');
      div.className = 'conv-item' + (c.id === CONV_ID ? ' active' : '');
      div.textContent = c.title + ' · ' + c.created_at;
      div.title = c.title;
      div.onclick = () => openConversation(c.id);
      box.appendChild(div);
    });
  } catch (e) { /* 列表加载失败不干扰聊天主流程 */ }
}

async function openConversation(id) {
  try {
    const resp = await fetch(API + '/chat/conversations/' + id + '/messages',
      { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!resp.ok) return;
    const data = await resp.json();
    CONV_ID = id;
    document.getElementById('chat').innerHTML = '';
    data.messages.forEach(m => {
      if (m.role === 'user' || m.role === 'assistant') addMsg(m.role, m.content);
    });
    loadConversations();
  } catch (e) {}
}

// ---------- 事件绑定 ----------
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
  e.target.value = '';
});
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
});
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ---------- 启动：已有 token 直接进主界面 ----------
if (TOKEN) enterApp();
</script>
</body>
</html>
